# Generado por init-keycloak.sh — no editar manualmente
# nginx reverse proxy para Keycloak con SSL (Let's Encrypt)

server {
    listen 80;
    server_name KEYCLOAK_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name KEYCLOAK_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/KEYCLOAK_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/KEYCLOAK_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Keycloak requiere estos headers para generar URLs correctas detrás de proxy
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        proxy_read_timeout         300s;
    }
}
