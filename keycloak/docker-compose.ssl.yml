# =============================================================================
# CDPI PoC — Keycloak SSL override (nginx del sistema + Let's Encrypt)
# -----------------------------------------------------------------------------
# Extiende docker-compose.yml con overrides para SSL.
# Keycloak sigue corriendo en HTTP internamente; los puertos 8080 y 9000
# siguen publicados. El nginx del sistema (instalado por init-keycloak.sh)
# termina TLS en el puerto 443 y hace proxy a 127.0.0.1:8080.
#
# Uso (gestionado por init-keycloak.sh):
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
#
# Prerequisito: nginx configurado y cert en /etc/letsencrypt/live/${DOMAIN}/
#               (init-keycloak.sh los configura automáticamente)
# =============================================================================

name: cdpi-keycloak

services:

  # Keycloak: publica 8080 y 9000 igual que en modo HTTP.
  # El nginx del sistema en el host enruta el tráfico HTTPS (443) a 127.0.0.1:8080.
  # El puerto 9000 (management) queda accesible para el health-check del script.
  keycloak:
    environment:
      # Keycloak genera tokens y redirects con la URL pública HTTPS
      KC_HOSTNAME_URL: https://${DOMAIN}
      KC_PROXY_HEADERS: xforwarded
