# =============================================================================
# CDPI PoC — CREDEBL Stack (Self-Contained)
# -----------------------------------------------------------------------------
# Replaces:  AWS S3   → MinIO   (S3-compatible, fully containerized)
#            SendGrid → Mailpit  (local SMTP, no external dependencies)
#            Keycloak → included (used as OIDC provider + mock)
#
# Excluded for PoC (non-critical for issuance/verification):
#   geolocation, notification, webhook
# Included here because Studio shared-wallet setup depends on it:
#   cloud-wallet
#
# RAM budget (~8GB VPS):
#   Infrastructure (postgres, redis, nats, keycloak, minio, mailpit) ~2.5GB
#   CREDEBL services (13 microservices)                              ~4.0GB
#   OS + Docker overhead                                             ~1.0GB
#   Buffer                                                           ~0.5GB
#
# Usage:
#   cp .env.example .env        # then fill in values
#   docker compose up -d
#   docker compose logs -f api-gateway
# =============================================================================

name: cdpi-credebl

# ---------------------------------------------------------------------------
# Infrastructure services
# ---------------------------------------------------------------------------
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: credebl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credebl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-credebl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credebl} -d ${POSTGRES_DB:-credebl}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: credebl-redis
    restart: unless-stopped
    # Keep Redis auth disabled in the self-contained PoC. Upstream CREDEBL's
    # Bull queue workers (including `issuance`) connect with host/port only and
    # do not pass REDIS_PASSWORD, which causes repeated `NOAUTH Authentication required` errors.
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── NATS ────────────────────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: credebl-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222", "-DV"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── MinIO (S3-compatible — replaces AWS S3) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: credebl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── MinIO setup (creates buckets and access keys) ───────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: credebl-minio-setup
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${S3_BUCKET_NAME:-credebl-bucket}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
        : "$${MINIO_ACCESS_KEY:?AWS_ACCESS_KEY_ID is required}"
        : "$${MINIO_SECRET_KEY:?AWS_SECRET_ACCESS_KEY is required}"
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}/default"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}/persist"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}/orgLogos"
        mc anonymous set public "local/$${MINIO_BUCKET}/default"
        mc anonymous set public "local/$${MINIO_BUCKET}/orgLogos"
        mc admin user info local "$${MINIO_ACCESS_KEY}" >/dev/null 2>&1 || \
          mc admin user add local "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc admin policy attach local readwrite --user "$${MINIO_ACCESS_KEY}"
        echo 'MinIO setup complete'
    networks:
      - credebl-net

  # ── Mailpit (SMTP mock — replaces SendGrid) ─────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: credebl-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — view sent emails at http://VPS_IP:8025
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Schema File Server ──────────────────────────────────────────────────────
  schema-file-server:
    image: ghcr.io/credebl/schema-file-server:latest
    container_name: credebl-schema-file-server
    # Upstream image runs as uid/gid 1993 (deno), but /app/schemas is root:root 775.
    # Run as root in this PoC so POST /schemas can persist schema files reliably.
    user: "0:0"
    restart: unless-stopped
    env_file: .env
    environment:
      # schema-file-server expects CRYPTO_PRIVATE_KEY as base64-encoded string.
      # Other services use the raw value from .env directly.
      # This is base64("cdpi-poc-crypto-key-change-me")
      CRYPTO_PRIVATE_KEY: "Y2RwaS1wb2MtY3J5cHRvLWtleS1jaGFuZ2UtbWU="
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # CREDEBL Platform services
  # ---------------------------------------------------------------------------

  # ── Seed (runs once, populates DB, then exits) ──────────────────────────────
  seed:
    image: ghcr.io/credebl/seed:latest
    container_name: credebl-seed
    restart: "no"
    user: "0:0"
    command: >
      sh -c 'mkdir -p /app/prisma/data &&
      ln -sfn /app/libs/prisma-service/prisma/data/geo-location-master-data /app/prisma/data/geo-location-master-data &&
      npx prisma migrate deploy --schema=./libs/prisma-service/prisma/schema.prisma &&
      npx ts-node ./libs/prisma-service/prisma/seed.ts'
    env_file: .env
    # KEYCLOAK_DOMAIN and KEYCLOAK_ADMIN_URL come from .env (set by init-credebl.sh
    # to the external Keycloak URL). extra_hosts maps the Keycloak hostname to
    # host-gateway so containers on credebl-net can reach Keycloak on the same VPS.
    extra_hosts:
      - "${VPS_IP}:host-gateway"
      - "${KEYCLOAK_HOST}:host-gateway"
    volumes:
      - ./config/credebl-master-table.json:/app/prisma/data/credebl-master-table/credebl-master-table.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - credebl-net

  # ── Platform admin bootstrap sync ───────────────────────────────────────────
  platform-admin-bootstrap:
    image: postgres:16-alpine
    container_name: credebl-platform-admin-bootstrap
    restart: "no"
    env_file: .env
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache curl jq >/dev/null && /bin/sh /work/bootstrap-platform-admin.sh
    extra_hosts:
      - "${VPS_IP}:host-gateway"
      - "${KEYCLOAK_HOST}:host-gateway"
    volumes:
      - ../scripts/bootstrap-platform-admin.sh:/work/bootstrap-platform-admin.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    image: ghcr.io/credebl/api-gateway:latest
    container_name: credebl-api-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      OOB_BATCH_SIZE: ${OOB_BATCH_SIZE:-50}
      PROOF_REQ_CONN_LIMIT: ${PROOF_REQ_CONN_LIMIT:-50}
    # extra_hosts ensures VPS self-connections and domain-based agentEndPoint calls
    # (e.g. http://credebl.example.com:8012) reach host-gateway (172.17.0.1-ish)
    # instead of the public IP (which VPS providers block for self-connections).
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    ports:
      - "5000:5000"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── User service ────────────────────────────────────────────────────────────
  user:
    image: ghcr.io/credebl/user:latest
    container_name: credebl-user
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      platform-admin-bootstrap:
        condition: service_completed_successfully
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Utility service ─────────────────────────────────────────────────────────
  utility:
    image: ghcr.io/credebl/utility:latest
    container_name: credebl-utility
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SDK_LOAD_CONFIG: "1"
    volumes:
      - ./config/aws/config:/root/.aws/config:ro
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Connection service ──────────────────────────────────────────────────────
  connection:
    image: ghcr.io/credebl/connection:latest
    container_name: credebl-connection
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      utility:
        condition: service_started
      user:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Issuance service ────────────────────────────────────────────────────────
  issuance:
    image: ghcr.io/credebl/issuance:latest
    container_name: credebl-issuance
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    environment:
      OOB_BATCH_SIZE: ${OOB_BATCH_SIZE:-50}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      user:
        condition: service_started
      connection:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ── Ledger service ──────────────────────────────────────────────────────────
  ledger:
    image: ghcr.io/credebl/ledger:latest
    container_name: credebl-ledger
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      user:
        condition: service_started
      connection:
        condition: service_started
      issuance:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Organization service ────────────────────────────────────────────────────
  organization:
    image: ghcr.io/credebl/organization:latest
    container_name: credebl-organization
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      user:
        condition: service_started
      connection:
        condition: service_started
      issuance:
        condition: service_started
      ledger:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ── Verification service ────────────────────────────────────────────────────
  verification:
    image: ghcr.io/credebl/verification:latest
    container_name: credebl-verification
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    environment:
      PROOF_REQ_CONN_LIMIT: ${PROOF_REQ_CONN_LIMIT:-50}
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      user:
        condition: service_started
      connection:
        condition: service_started
      issuance:
        condition: service_started
      ledger:
        condition: service_started
      organization:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ── Agent Provisioning ──────────────────────────────────────────────────────
  agent-provisioning:
    image: ghcr.io/credebl/agent-provisioning:latest
    container_name: credebl-agent-provisioning
    restart: unless-stopped
    env_file: .env
    environment:
      ROOT_PATH: ${PWD}/.agent-runtime/agent-config
      AGENT_API_KEY: ${AGENT_API_KEY:-credeblagentkey1234}
      INBOUND_PORT_START: ${INBOUND_PORT_START:-9100}
      AFJ_VERSION: ${AFJ_VERSION:-ghcr.io/credebl/credo-controller:latest}
      AFJ_AGENT_SPIN_UP: ${AFJ_AGENT_SPIN_UP:-/agent-provisioning/AFJ/scripts/docker_start_agent.sh}
      AFJ_AGENT_ENDPOINT_PATH: ${AFJ_AGENT_ENDPOINT_PATH:-/agent-provisioning/AFJ/endpoints/}
    volumes:
      - ${PWD}/.agent-runtime/agent-config:/app/agent-provisioning/AFJ/agent-config
      - ${PWD}/.agent-runtime/token:/app/agent-provisioning/AFJ/token
      - ${PWD}/.agent-runtime/endpoints:/app/agent-provisioning/AFJ/endpoints
      - ${PWD}/.agent-runtime/agent.env:/app/agent.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Healthcheck: passes once the NestJS microservice process is running.
    # agent-service depends on this being healthy before it starts, which
    # prevents the race condition where agent-service tries to call
    # agent-provisioning via NATS before it has finished Prisma migrations.
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'node.*main' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      organization:
        condition: service_started
      verification:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Agent Service ───────────────────────────────────────────────────────────
  agent-service:
    image: ghcr.io/credebl/agent-service:latest
    container_name: credebl-agent-service
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    environment:
      PLATFORM_WALLET_NAME: ${PLATFORM_WALLET_NAME:-platformadminwallet}
      PLATFORM_WALLET_PASSWORD: ${PLATFORM_WALLET_PASSWORD:-platformadminwallet123}
      WALLET_STORAGE_HOST: ${WALLET_STORAGE_HOST:-172.17.0.1}
      WALLET_STORAGE_PORT: ${WALLET_STORAGE_PORT:-5432}
      WALLET_STORAGE_USER: ${WALLET_STORAGE_USER:-credebl}
      WALLET_STORAGE_PASSWORD: ${POSTGRES_PASSWORD}
      AGENT_PROTOCOL: ${AGENT_PROTOCOL:-http}
      AGENT_API_KEY: ${AGENT_API_KEY:-credeblagentkey1234}
      AFJ_VERSION: ${AFJ_VERSION:-ghcr.io/credebl/credo-controller:latest}
      SOCKET_HOST: ${SOCKET_HOST:-http://api-gateway:5000}
    command: >
      sh -ec '
        : "${PLATFORM_WALLET_NAME:?PLATFORM_WALLET_NAME is required}";
        : "${PLATFORM_WALLET_PASSWORD:?PLATFORM_WALLET_PASSWORD is required}";
        : "${AGENT_API_KEY:?AGENT_API_KEY is required}";
        : "${WALLET_STORAGE_HOST:?WALLET_STORAGE_HOST is required}";
        : "${WALLET_STORAGE_PORT:?WALLET_STORAGE_PORT is required}";
        : "${WALLET_STORAGE_USER:?WALLET_STORAGE_USER is required}";
        : "${WALLET_STORAGE_PASSWORD:?WALLET_STORAGE_PASSWORD is required}";
        : "${SOCKET_HOST:?SOCKET_HOST is required}";
        : "${AFJ_VERSION:?AFJ_VERSION is required}";
        sleep 30 && node dist/apps/agent-service/main.js
      '
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/.agent-runtime/agent-config:/app/agent-provisioning/AFJ/agent-config
      - ${PWD}/.agent-runtime/token:/app/agent-provisioning/AFJ/token
    depends_on:
      agent-provisioning:
        condition: service_healthy
      platform-admin-bootstrap:
        condition: service_completed_successfully
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Cloud Wallet (required for Studio shared-wallet / create-tenant) ──────
  cloud-wallet:
    image: ghcr.io/credebl/cloud-wallet:latest
    container_name: credebl-cloud-wallet
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── OID4VC Issuance service (SD-JWT OID4VCI) ────────────────────────────────
  oid4vc-issuance:
    image: ghcr.io/credebl/oid4vc-issuance:latest
    container_name: credebl-oid4vc-issuance
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      issuance:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── OID4VC Verification service (OID4VP) ─────────────────────────────────────
  oid4vc-verification:
    image: ghcr.io/credebl/oid4vc-verification:latest
    container_name: credebl-oid4vc-verification
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      verification:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Ecosystem service ────────────────────────────────────────────────────────
  ecosystem:
    image: ghcr.io/credebl/ecosystem:latest
    container_name: credebl-ecosystem
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      "${VPS_IP}": host-gateway
      "${API_ENDPOINT}": host-gateway
    depends_on:
      nats:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      user:
        condition: service_started
      organization:
        condition: service_started
    networks:
      - credebl-net
    deploy:
      resources:
        limits:
          memory: 256M

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  minio_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  credebl-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
